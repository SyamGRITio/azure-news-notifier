[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-news-notifier"
version = "0.1.0"
description = "Azure RSS feeds, short Japanese translations, and a daily Slack digest"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
azure = ["azure-identity>=1.19,<2"]

[tool.setuptools]
py-modules = ["local_check"]

[tool.setuptools.packages.find]
include = ["notifier*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
